<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/icon/logo.svg" type="image/x-icon">
    <title>Comercial</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/comercial.css">
</head>
<!-- Cada página possui seu próprio arquivo JS e CSS. Dê preferência ao uso dos arquivos existentes e, caso seja necessário, crie novos arquivos. -->

<body>

    <main>
        <div class="sidebar" id="sidebar"></div>
        <div class="main-posLogin">
            <div class="topo">
                <div class="titulo">
                    Comercial
                </div>
                <div class="user" id="userNav"></div>
            </div>
            <div class="conteudo">

                <div class="kpis-comercial">
                    <div class="kpi-card card">
                        <div class="kpi-icone circulo">
                            <i class="fa-solid fa-dollar-sign"></i>
                        </div>
                        <div class="kpi-texto">
                            <span class="kpi-label">Receita Bruta</span>
                            <span class="kpi-valor" id="kpiReceita">R$0,00</span>
                        </div>
                    </div>
                    <div class="kpi-card card">
                        <div class="kpi-icone">
                            <i class="fa-solid fa-money-bill-trend-up"></i>
                        </div>
                        <div class="kpi-texto">
                            <span class="kpi-label">Rentabilidade</span>
                            <span class="kpi-valor" id="kpiRentabilidade">R$0,00</span>
                        </div>
                    </div>
                    <div class="kpi-card card">
                        <div class="kpi-icone">
                            <i class="fa-solid fa-file-invoice-dollar"></i>
                        </div>
                        <div class="kpi-texto">
                            <span class="kpi-label">Despesas</span>
                            <span class="kpi-valor laranja" id="kpiDespesas">R$0,00</span>
                        </div>
                    </div>
                    <div class="kpi-card card">
                        <div class="kpi-icone">
                            <i class="fa-solid fa-truck-fast"></i>
                        </div>
                        <div class="kpi-texto">
                            <span class="kpi-label">Fretes</span>
                            <span class="kpi-valor" id="kpiFretes">0</span>
                        </div>
                    </div>
                </div>

                <div class="faturamento card">
                    <div class="grafico-titulo">
                        <i class="fa-solid fa-sack-dollar"></i>
                        <span>Faturamento Mensal</span>
                    </div>
                    <div class="grafico-corpo">
                        <canvas id="faturamentoChart"></canvas>
                    </div>
                </div>

                <div class="filtro">
                    <label for="selectMes">Mês</label>
                    <div class="filtro-linha">
                        <select id="selectMes">
                            <option value="1">Janeiro</option>
                            <option value="2">Fevereiro</option>
                            <option value="3">Março</option>
                            <option value="4">Abril</option>
                            <option value="5">Maio</option>
                            <option value="6">Junho</option>
                            <option value="7">Julho</option>
                            <option value="8">Agosto</option>
                            <option value="9">Setembro</option>
                            <option value="10">Outubro</option>
                            <option value="11">Novembro</option>
                            <option value="12">Dezembro</option>
                        </select>
                        <button type="button" class="botao-filtrar" id="btnFiltrarMes">Filtrar</button>
                    </div>
                </div>

                <div class="graficosRosca">
                    <div class="rosca card">
                        <div class="grafico-titulo">
                            <span>Frete Líquido por Faixa de Valor</span>
                        </div>
                        <div class="rosca-corpo">
                            <div class="rosca-legenda" id="legendaFaixa"></div>
                            <div class="rosca-grafico">
                                <canvas id="faixaChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="rosca card">
                        <div class="grafico-titulo">
                            <span>Receita de Fretes por Cliente - Top 5</span>
                        </div>
                        <div class="rosca-corpo">
                            <div class="rosca-legenda" id="legendaCliente"></div>
                            <div class="rosca-grafico">
                                <canvas id="clienteChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="veiculos-titulo">
                    <i class="fa-solid fa-truck"></i>
                    <span>Gasto por veículo</span>
                </div>

                <div class="filtros-veiculo">
                    <div class="filtro">
                        <label for="selectStatus">Status</label>
                        <select id="selectStatus">
                            <option>Todos</option>
                            <option>Ativo</option>
                            <option>Em viagem</option>
                            <option>Em manutenção</option>
                        </select>
                    </div>
                    <div class="filtro">
                        <label for="selectMarca">Marca</label>
                        <select id="selectMarca">
                            <option value="">Qualquer</option>
                        </select>
                    </div>
                    <div class="filtro">
                        <label for="selectModelo">Modelo</label>
                        <select id="selectModelo">
                            <option value="">Qualquer</option>
                        </select>
                    </div>
                </div>

                <div class="filtro-botoes">
                    <button type="button" class="botao-filtrar" id="btnFiltrarVeiculos">Filtrar</button>
                    <a href="#" class="limpar-filtros" id="limparFiltros">Limpar filtros</a>
                </div>

                <div class="lista-veiculos" id="listaVeiculos"></div>

            </div>
        </div>
    </main>

    <script src="js/componentes/sidebar.js"></script>
    <script src="js/session.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/comercial.js"></script>
</body>

</html>
