<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="assets/icon/icon.png" type="image/x-icon">
  <title>NextLog | Veículos</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/veiculos.css">
</head>

<body>
  <main>

    <!-- Sidebar global (.sidebar - global.css) -->
    <aside class="sidebar">
      <a class="logo" href="index.html"><img src="assets/icon/logo.png" alt="Logo NextLog"></a>
      <nav class="links">
        <a class="link" href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a class="link" href="fretes.html"><i class="fa-solid fa-cube"></i> Fretes</a>
        <a class="link ativo" href="veiculos.html"><i class="fa-solid fa-truck"></i> Veículos</a>
        <a class="link" href="financas.html"><i class="fa-solid fa-wallet"></i> Finanças</a>
        <a class="link" href="funcionarios.html"><i class="fa-regular fa-user"></i> Funcionários</a>
      </nav>
    </aside>

    <!-- Estrutura pós-login global (.main-posLogin / .topo / .user / .conteudo - global.css) -->
    <div class="main-posLogin">
      <div class="topo">
        <h1 class="titulo">Veículos</h1>
        <div class="user">
          <a class="userButton" href="perfil.html" aria-label="Perfil"><i class="fa-regular fa-user"></i></a>
          <a class="buttonSair" href="login.html" id="btn-sair">Sair</a>
        </div>
      </div>

      <div class="conteudo conteudo-veiculos">

        <!-- Filtros -->
        <form class="filtros" id="form-filtros">
          <div class="busca">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="busca-placa" placeholder="Buscar por placa" autocomplete="off">
          </div>

          <div class="filtros-corpo">
            <div class="selects">
              <label class="campo">
                <span>Status</span>
                <select id="filtro-status">
                  <option value="">Todos</option>
                  <option value="ativo">Ativo</option>
                  <option value="manutencao">Em manutenção</option>
                  <option value="inativo">Inativo</option>
                </select>
              </label>
              <label class="campo">
                <span>Marca</span>
                <select id="filtro-marca">
                  <option value="">Qualquer</option>
                </select>
              </label>
              <label class="campo">
                <span>Modelo</span>
                <select id="filtro-modelo">
                  <option value="">Qualquer</option>
                </select>
              </label>
            </div>

            <div class="acoes">
              <button type="submit" class="btn-filtrar">Filtrar</button>
              <button type="button" class="btn-limpar" id="btn-limpar">Limpar filtros</button>
            </div>
          </div>
        </form>

        <p class="quantidade">Quantidade: <span id="quantidade">0</span></p>

        <section class="lista-veiculos" id="lista-veiculos"></section>
        <p class="sem-resultado" id="sem-resultado" hidden>Nenhum veículo encontrado.</p>
      </div>
    </div>
  </main>

  <button class="chatbot" type="button" aria-label="Assistente virtual"><i class="fa-solid fa-robot"></i></button>

  <script src="js/veiculos.js"></script>
</body>

</html>
