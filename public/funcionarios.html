<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>NextLog | Funcionários</title>


    <link rel="shortcut icon" href="assets/icon/icon.png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/funcionarios.css">
</head>


<body>
    <main>
        <div class="sidebar" id="sidebar"></div>

        <div class="main-posLogin">
            <div class="topo">
            <h1 class="titulo">Funcionários</h1>
            <div class="user" id="userNav"></div>
            </div>

       <div class="conteudo">

    <form
        class="filtros"
        id="form-filtros"
    >

        <div class="busca">
            <input
                type="search"
                id="busca"
                placeholder="Buscar por nome, e-mail ou CPF..."
            >
        </div>

        <div class="filtro-cargo">
            <label for="cargo">Cargo</label>

            <select id="cargo">
                <option value="">Todos</option>
                <option value="Analista de Logística">Analista de Logística</option>
                <option value="Analista Financeiro">Analista Financeiro</option>
            </select>
        </div>

        <div class="acoes">
            <button type="submit" class="btn-filtrar">
                Filtrar
            </button>

            <button
                type="button"
                class="btn-limpar"
                onclick="limparFiltros()"
            >
                Limpar filtros
            </button>
        </div>

    </form>
    <section class="painel-lista">

        <div class="cabecalho-lista">

        <p class="quantidade">
            Quantidade: <span id="quantidade">0</span>
        </p>
        <button type="button" id="btn-novo" onclick="abrirFormulario(-1)">Adicionar</button>

        </div>

        <div class="lista">
           <table>
               <thead><tr>

                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>Cargo</th>
                  <th>Telefone</th>
                  <th>Ações</th>
                </tr>
            </thead>
        <tbody id="lista"></tbody>
    </table>

    <p id="sem-resultado" class="sem-resultado" hidden>
        Nenhum funcionário encontrado.
    </p>
</div>
</section>

 <p id="mensagem" class="mensagem" role="status"></p>

</div>
</div>
</main>

<form class="formulario" id="form-funcionario" hidden novalidate>
    <div class="formulario-conteudo">
    <h2 id="titulo-formulario">Adicionar novo funcionário</h2>
    
    <div class="campo">
        <label for ="nome">
            Nome
        </label>

         <input
            type="text"
            id="nome"
            maxlength="45"
            placeholder="Digite o nome completo"
            required
        >
        <small class="erro-campo" id="erro-nome"></small>
    </div>

    <div class="campo">

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            maxlength="60"
            placeholder="Digite o e-mail"
            required
        >
        <small class="erro-campo" id="erro-email"></small>
    </div>

    <div class="campo">
    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        name="senha"
        minlength="8"
        required
        placeholder="Digite uma senha"
    >
    <small class="erro-campo" id="erro-senha"></small>
</div>

    <div class="campo">
    <label for="cargo-funcionario">
        Cargo
    </label>

    <select id="cargo-funcionario" required>
        <option value="" disabled selected>Selecione um cargo</option>
        <option value="Analista de Logística">Analista de Logística</option>
        <option value="Analista Financeiro">Analista Financeiro</option>
    </select>

    <small class="erro-campo" id="erro-cargo-funcionario"></small>
    </div> 

        <div class="campo-formulario">
        <label for="isAdmin">
        <input
            type="checkbox"
            id="isAdmin"
            name="isAdmin"
        >
        Administrador
         </label>
        </div>

        <div class="campo">
        <label for="cpf">
            CPF
        </label>

        <input
            type="text"
            id="cpf"
            maxlength="14"
            placeholder="000.000.000-00"
            required
        >
        <small class="erro-campo" id="erro-cpf"></small>
    </div>
         
         <div class="campo">
        <label for="telefone">
            Telefone
        </label>

        <input
            type="tel"
            id="telefone"
            maxlength="15"
            placeholder="(11) 99999-9999"
            required
        >
        <small class="erro-campo" id="erro-telefone"></small>
    </div>
            

    <p id="erro-formulario" role="alert"></p>
    
    <div class="botoes-formulario">
            <button type="button" class="btn-cancelar" id="btn-cancelar" onclick="fecharFormulario()">Cancelar</button>
            <button type="submit" class="btn-confirmar" id="btn-salvar">Salvar</button>
    </div>
</div>
</form>

<script src="js/componentes/sidebar.js"></script>
<script src="js/session.js"></script>
<script src="js/funcionarios.js"></script></body></html>
