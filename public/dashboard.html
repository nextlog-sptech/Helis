<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/icon/logo.svg" type="image/x-icon">
    <title>Home</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<!-- Cada página possui seu próprio arquivo JS e CSS. Dê preferência ao uso dos arquivos existentes e, caso seja necessário, crie novos arquivos. -->

<body>

    <main>
        <div class="sidebar" id="sidebar"></div>
        <div class="main-posLogin">

                    Bem vindo, Fernanda
                </div>
                <div class="user" id="userNav"></div>
            </div>
            <div class="conteudo">
                <div class="kpis card">
                    <div class="kpi">
                        <div class="img">
                            <i class="fa-solid fa-dollar-sign"></i>
                        </div>
                        <div class="fat">
                            <h3>Faturamento</h3>
                            <a>R$50.000,00</a>
                        </div>
                    </div>
                    <div class="kpi">
                        <div class="img1">
                            <i class="fa-solid fa-truck-fast"></i>
                        </div>
                        <div class="fat">
                            <h3>Total de Fretes</h3>
                            <a>500</a>
                        </div>
                    </div>
                    <div class="kpi">
                        <div class="img2">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>

                            <a>40</a>
                        </div>
                    </div>
                    <div class="kpi">
                        <div class="img3">
                            <i class="fa-regular fa-user"></i>
                        </div>

                            <h3>Clientes</h3>
                            <a>67</a>
                        </div>
                    </div>
                    <div class="kpi">
                        <div class="img4">
                            <i class="fa-solid fa-truck"></i>
                        </div>
                        <div class="fat">
                            <h3>Veículos</h3>
                            <a>70</a>
                        </div>

                </div>
            </div>
