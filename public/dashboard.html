<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/icon/logo.svg" type="image/x-icon">
    <title>Home</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<!-- Cada página possui seu próprio arquivo JS e CSS. Dê preferência ao uso dos arquivos existentes e, caso seja necessário, crie novos arquivos. -->

<body>

    <main>
        <div class="sidebar" id="sidebar"></div>
        <div class="main-posLogin">
            <div class="topo">
                <div class="titulo">
                    Bem vindo, Fernanda
                </div>
                <div class="user" id="userNav"></div>
            </div>
            <div class="conteudo">
                <div class="kpis card">
                    <div class="kpi">
                        <div class="img">
                            <i class="fa-solid fa-dollar-sign"></i>
                        </div>
                        <div class="fat">
                            <h3>Faturamento</h3>
                            <a>R$50.000,00</a>
                        </div>
                    </div>
                    <div class="kpi">
                        <div class="img1">
                            <i class="fa-solid fa-truck-fast"></i>
                        </div>
                        <div class="fat">
                            <h3>Total de Fretes</h3>
                            <a>500</a>
                        </div>
                    </div>
                    <div class="kpi">
                        <div class="img2">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div class="fat">
                            <h3>Alertas de custo</h3>
                            <a>40</a>
                        </div>
                    </div>
                    <div class="kpi">
                        <div class="img3">
                            <i class="fa-regular fa-user"></i>
                        </div>
                        <div class="fat">
                            <h3>Clientes</h3>
                            <a>67</a>
                        </div>
                    </div>
                    <div class="kpi">
                        <div class="img4">
                            <i class="fa-solid fa-truck"></i>
                        </div>
                        <div class="fat">
                            <h3>Veículos</h3>
                            <a>70</a>
                        </div>
                    </div>
                </div>
                <div class="chart-container">
                <div class="chart-title">
                    Fretes por estado
                </div>
                <canvas id="fretesChart"></canvas>
                </div>
            </div>
        </div>
    </main>
</body>
<script src="js/componentes/sidebar.js"></script>
<script src="js/session.js"></script>
<script src="js/dasboard.js"></script>
<script>
    const data = {
      labels: ['São Paulo', 'Rio de Janeiro', 'Minas Gerais', 'Bahia'],
      datasets: [
        {
          label: 'Fretes',
          data: [156, 89, 42, 23],
          backgroundColor: [
            '#007bff', // azul
            '#007bff', // azul
            '#ff7f0e', // laranja
            '#ff7f0e'  // laranja
          ],
          borderRadius: 6
        }
      ]
    };

    const config = {
      type: 'bar',
      data: data,
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          title: {
            display: false,
            text: 'Chart.js Bar Chart'
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 200,
            ticks: { stepSize: 50 }
          }
        }
      }
    };

    new Chart(document.getElementById('fretesChart'), config);
  </script>
</html>
